# Screenshots of the MINT interface for README on real Streamlit (tools/ui_preview/run_preview.py --readme): neutral
# demo data, English and Russian, plus the README Mermaid diagrams as GitHub will draw them.
# The result goes to the ui-preview-<branch> branch (slashes become dashes): en/, ru/ — PNG screens, dom.txt, errors.txt.
name: UI preview

on:
  push:
    branches: ["feat/ui-*", "feat/eval-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Каждая установка — своим шагом со своим лимитом: зависшая загрузка браузера или apt (бывает на свежих
      # раннерах) не съедает все 25 минут. Не скачался Chromium — снимки делаются в Chrome, который есть на раннере.
      - name: Install Python packages
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install streamlit faiss-cpu "numpy>=1.26" requests "python-docx>=1.2" python-dotenv PyYAML playwright
      - name: Install Chromium for Playwright
        timeout-minutes: 6
        continue-on-error: true
        run: python -m playwright install chromium
      - name: Install ffmpeg (GIFs)
        timeout-minutes: 4
        continue-on-error: true
        run: sudo apt-get install -y ffmpeg >/dev/null
      # На GitHub — только снимки для README: нейтральная демо-база без отраслевых терминов. Полный набор экранов
      # (демо-база с регламентами по безопасности) — только локально: python tools/ui_preview/run_preview.py
      - name: Screenshots for README (English and Russian)
        timeout-minutes: 12
        run: |
          python tools/ui_preview/run_preview.py --out preview/en --readme --lang en
          python tools/ui_preview/run_preview.py --out preview/ru --readme --lang ru
      - name: Publish to the ui-preview-<branch> branch
        if: always()
        run: |
          [ -d preview ] || exit 0
          cd preview
          printf "UI preview for %s (%s)\n" "${GITHUB_SHA::7}" "${GITHUB_REF_NAME}" > README.md
          target="ui-preview-${GITHUB_REF_NAME//\//-}"
          git init -q -b "$target"
          git config user.name "ui-preview"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI preview for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$target"
