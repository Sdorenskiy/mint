name: Rebuild Mint diagrams

on:
  push:
    branches:
      - 'docs/diagrams-*'
    paths:
      - '.github/workflows/diagram-artifacts.yml'
      - 'tools/diagrams/build_architecture.py'
      - 'tools/diagrams/build_engineering.py'
      - 'tools/diagrams/en.py'
      - 'tools/diagrams/render.py'
      - 'tools/diagrams/xl.py'
      - 'release/manifest.json'
  workflow_dispatch:

concurrency:
  group: mint-diagrams-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'Sdorenskiy/mint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Preview dependencies
        run: python -m pip install 'matplotlib>=3.8,<4'
      - name: Generate bilingual Excalidraw and Obsidian diagrams
        working-directory: tools/diagrams
        run: |
          python build_architecture.py ../../docs/ru/MINT_architecture
          python build_architecture.py ../../docs/MINT_architecture --lang en
          python build_engineering.py ../../docs/ru/MINT_engineering
          python build_engineering.py ../../docs/MINT_engineering --lang en
      - name: Render four PNG previews
        working-directory: tools/diagrams
        run: |
          python render.py ../../docs/MINT_architecture.excalidraw ../../docs/MINT_architecture_preview.png 0.5
          python render.py ../../docs/MINT_engineering.excalidraw ../../docs/MINT_engineering_preview.png 0.35
          python render.py ../../docs/ru/MINT_architecture.excalidraw ../../docs/ru/MINT_architecture_preview.png 0.5
          python render.py ../../docs/ru/MINT_engineering.excalidraw ../../docs/ru/MINT_engineering_preview.png 0.35
      - name: Verify generated artifacts and release marker
        run: python tools/diagrams/check_release.py
      - name: Commit only generated diagram assets to this branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MINT_architecture.excalidraw docs/MINT_architecture.excalidraw.md docs/MINT_architecture_preview.png
          git add docs/MINT_engineering.excalidraw docs/MINT_engineering.excalidraw.md docs/MINT_engineering_preview.png
          git add docs/ru/MINT_architecture.excalidraw docs/ru/MINT_architecture.excalidraw.md docs/ru/MINT_architecture_preview.png
          git add docs/ru/MINT_engineering.excalidraw docs/ru/MINT_engineering.excalidraw.md docs/ru/MINT_engineering_preview.png
          if git diff --cached --quiet; then
            echo 'Diagrams already current'
            exit 0
          fi
          git commit -m 'docs: regenerate v21.4.1 architecture and engineering diagrams'
          git fetch origin "refs/heads/${GITHUB_REF_NAME}"
          git rebase FETCH_HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
