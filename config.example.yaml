# Настройки MINT. Файл НЕОБЯЗАТЕЛЬНЫЙ: всё, чего здесь нет, берётся по умолчанию.
# Чтобы изменить параметр, скопируйте файл в config.yaml и оставьте только нужные строки.
# Адреса сервисов, ключи и имена моделей задаются не здесь, а в .env.
# Группы (models:, llm:, ...) — только для удобства чтения; важны имена параметров.
#
# Порядок приоритета: изменения в боковой панели (на время сеанса) > config.yaml > расчёт MINT > умолчания.

# Профиль — набор промптов для чата, аудита и контроля исправлений: architecture (по умолчанию) — архитектура и
# ИТ-решения (роли «Архитектурного комитета», архитектурные критерии аудита); general — любые документы (договоры,
# положения, отчёты, инструкции). Меняется и в боковой панели («🧭 Профиль») на время сеанса.
profile: architecture

models:
  # Лимиты моделей. 0 — узнать у сервера (если он сообщает) или взять типовое значение.
  # От них MINT рассчитывает размеры фрагментов и объём контекста (см. ниже «рассчитываемые»).
  llm_context_tokens: 0       # окно контекста LLM; типовое — 32768
  embed_max_tokens: 0         # вход модели эмбеддингов; типовое — 8192 (у многих моделей — 512!)
  rerank_max_tokens: 0        # вход реранкера (запрос + документ); типовое — 8192
  chars_per_token: 0          # символов текста на токен; типовое — 2.5, кнопка в панели измеряет на языке базы

  # Префиксы для моделей эмбеддингов, обученных с инструкцией. По умолчанию MINT подбирает их по имени
  # модели (EMBED_MODEL): Qwen3-Embedding и e5-instruct — инструкция к запросу; e5 — "query: "/"passage: ";
  # nomic-embed, FRIDA, ru-en-RoSBERTa — "search_query: "/"search_document: "; bge-m3 и прочие — без префикса.
  # Задайте явно, только если модель не распознана. Смена embed_doc_prefix требует переиндексации.
  # embed_query_prefix: "query: "
  # embed_doc_prefix: "passage: "

llm:
  temperature: 0.1
  max_tokens: 1500            # максимальная длина ответа; больше ответ — меньше места под фрагменты
  llm_timeout: 90             # сек на одну попытку
  llm_retries: 2              # попыток при таймауте и 502/503/504; на 429 — не меньше 4
  llm_no_reasoning: false     # true — выключить рассуждения модели перед ответом (стандартный параметр vLLM, SGLang)
  llm_stream: true            # аудит: ответ потоком, MINT обрывает слишком длинный или зациклившийся ответ
  # llm_extra_body:           # свои параметры запроса к LLM для вашего шлюза (можно и в .env: LLM_EXTRA_BODY)
  #   top_p: 0.9
  request_timeout: 120        # сек на запрос к реранкеру

indexing:
  embed_batch_size: 32

search:
  top_k: 0                    # фрагментов в контексте модели; 0 — автоматически (4 или 5 по размеру базы)
  initial_k: 50               # кандидатов из векторного поиска
  bm25_top_k: 20              # кандидатов из BM25
  rerank_top_k: 16            # кандидатов после слияния
  rrf_constant: 60
  weight_dense: 1.0
  weight_bm25: 1.0
  weight_rerank: 0.7          # 0 — порядок без реранкера, его баллы остаются для «уверенность низкая»
  max_table_parts: 2          # частей одной таблицы в контексте; 0 — без ограничения
  use_multi_query: false      # альтернативная формулировка вопроса (+1 вызов LLM)
  multi_query_alt_weight: 0.85

reranker:
  # Реранкер оценивает всех кандидатов (search.rerank_top_k). Если они не помещаются в один запрос,
  # остальные уходят следующими запросами.
  rerank_max_docs: 10         # документов в одном запросе (ограничение шлюза)
  rerank_char_budget: 9000    # символов в одном запросе (ограничение шлюза)
  rerank_with_meta: true      # имя файла и раздел в тексте для реранкера
  min_rerank_score: 0.15      # подобран под шкалу bge-reranker (0…1); для другого реранкера проверьте

confidence:                   # пометка «уверенность низкая»; пороги под свою базу подбирает eval_search.py
  low_conf_rerank: 0.30       # с реранкером: лучший балл реранкера ниже порога
  low_conf_lexical: 0.50      # без реранкера: доля слов вопроса в контексте ниже порога
  low_conf_agree_top: 5       #   и dense с BM25 не сошлись в топ-N
  show_source_details: true

chat:
  chat_history_turns: 2       # пар «вопрос — ответ» для уточняющих вопросов (+1 вызов LLM); 0 — без истории

consult:                      # вкладка «Консультант»: разбор проблем, схемы, объяснения с опорой на базу
  consult_queries: 4          # поисковых запросов по сторонам вопроса (и ещё поиск по самому запросу)
  consult_per_query: 4        # фрагментов на каждый поиск — до расширения до разделов
  consult_expand_sections: true      # найденный раздел — целиком, с подразделами
  consult_section_max_chars: 12000   # раздел длиннее — окно вокруг найденного места
  consult_context_max_chars: 60000   # потолок фрагментов в запросе (фактически — меньшее с окном модели)
  consult_max_tokens: 4000    # длина ответа
  consult_temperature: 0.3
  consult_history_turns: 3    # прошлых пар «запрос — ответ» в контексте

glossary:
  glossary_auto: true         # собирать сокращения из загруженных документов
  glossary_in_context: true   # передавать модели справочник сокращений
  glossary_max_entries: 20

audit:
  use_self_critique: true
  audit_full_document: true     # весь документ в каждой проверке раздела (если помещается в окно модели)
  audit_merge_duplicates: true  # в конце аудита модель сводит повторы замечаний (+1 вызов LLM)
  audit_known_abbreviations: "" # свои общеизвестные сокращения через запятую: проверка сокращений их не отмечает
  audit_deep: true              # глубокая проверка: процесс по шагам, противоречия, цифры, опечатки (+ вызовы LLM)
  audit_deep_max_calls: 60      # не больше стольких вопросов модели в глубокой проверке; 0 — без лимита
  audit_parallel: 3             # запросов к модели одновременно (если шлюз отвечает 429 — уменьшите)
  audit_pinned_max_chars: 20000 # правила экспертов и карточки систем на один запрос аудита (сверх норм поиска)
  audit_systems: true           # по каждой системе с карточкой, упомянутой в документе: что документ от неё требует
  audit_basis_docs: true        # документы-основания из базы (по ссылкам на титуле и в «Ссылочных документах»)
  audit_basis_max_chars: 8000   # их фрагменты на один запрос аудита (сверх норм поиска); 0 — не передавать
  audit_passes: 1               # проходов проверки разделов и глубокой проверки (2–3 — стабильнее, но дольше)
  audit_summary_max: 12         # «Главное» в начале заключения: не больше стольких замечаний; 0 — без блока
  audit_reasoning: false        # аудит с рассуждениями модели (дольше, таймаут не меньше 300 с)

review:
  review_top_sections: 3

# ===== Рассчитываемые параметры =====
# MINT вычисляет их по лимитам моделей (значение = меньшее из умолчания и потолка модели).
# Раскомментируйте строку, только если хотите зафиксировать значение вручную — расчёт для неё отключится.
#
# smart_truncate_chars: 3500       # фрагмент в контексте чата
# parent_size: 2500                # parent-фрагмент (индексация)
# parent_overlap: 300
# child_size: 400                  # child-фрагмент (индексация, вход эмбеддингов)
# child_overlap: 150
# section_embed_chars: 4000        # раздел документа для эмбеддинга (вкладка 3)
# audit_query_chars: 2000          # запрос к базе из раздела документа
# audit_map_size: 4500             # раздел документа на одну проверку
# audit_context_max_chars: 9000    # нормативный контекст в аудите
# review_context_max_chars: 12000  # фрагменты новой редакции на замечание
# rerank_query_max_chars: 1500     # запрос для реранкера
# rerank_doc_max_chars: 800        # фрагмент документа для реранкера (самая релевантная часть)
