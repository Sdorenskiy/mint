# Чек-листы аудита MINT по типам документов — ОБРАЗЕЦ.
#
# Свои чек-листы MINT хранит в checklists.yaml рядом с программой: этот файл в репозиторий не попадает и при
# обновлении MINT не затирается. Пока своего файла нет, MINT берёт чек-листы из этого образца. Править удобнее
# в интерфейсе: «Аудит документа» → «📋 Чек-лист по типу документа» → «💾 Сохранить» (создаст checklists.yaml).
#
# common — пункты для любого документа.
# types  — типы документов:
#   name  — название типа (показывается в интерфейсе и в заключении);
#   match — слова, по которым MINT узнаёт тип: ищутся в имени файла и в начале документа (титульный лист);
#           побеждает тип, слово которого встретилось раньше всех;
#   items — пункты чек-листа.
#
# Каждый пункт — отдельный вопрос модели по всему документу (+1 вызов LLM). Пишите пункт так, чтобы ответ можно
# было найти в тексте документа: «Для каждой роли описано, что она делает в системе», а не «Учтены ли все роли».

common:
  - Из документа понятна цель его выпуска — зачем он нужен и какое решение по нему принимается
  - Указаны основания для разработки документа (решения, задания, предшествующие документы), и они приложены или на них есть ссылки
  - Указаны инициатор (заказчик) документа и ответственные за его исполнение
  - Все сокращения и термины, которые используются в документе, определены
  - Обязательства участников указаны однозначно — кто, что и к какому сроку делает

types:
  - name: Техническое задание
    match: [техническое задание, технического задания]
    items:
      - Каждое требование однозначно и проверяемо — понятно, как проверить его выполнение
      - Указаны показатели назначения (объёмы, производительность, время отклика, доступность) с числовыми значениями
      - Описаны интерфейсы со смежными системами — что передаётся, в каком формате, по какому протоколу и кто начинает обмен
      - Указаны требования к защите информации с учётом категории обрабатываемых данных
      - Указаны этапы и сроки работ, и сроки не противоречат зависимостям от смежных систем
      - Указаны состав и порядок испытаний и приёмки работ
      - Указан состав документации, которая передаётся по результатам работ

  - name: Функциональные требования
    match: [функциональные требования, функциональных требований]
    items:
      - Для каждой роли пользователей описано, что она делает в системе и какие у неё права
      - Для каждого бизнес-процесса указаны участники, входные данные, результаты и последовательность шагов, и нет шагов без исполнителя
      - Описаны сценарии использования, включая ошибочные и исключительные ситуации
      - Указаны показатели назначения с числовыми значениями
      - Требования можно реализовать и проверить — нет неоднозначных формулировок

  - name: Архитектурное решение
    match: [архитектурное решение, архитектурное описание, архитектура решения, проектное решение, техническое решение]
    items:
      - Описаны компоненты решения и их взаимодействие — через что, какие данные и в каком направлении
      - Для каждой используемой системы или платформы понятно, хватает ли её текущих возможностей или нужна доработка
      - Решение обеспечивает заявленные показатели назначения (объёмы, производительность, доступность)
      - Описана защита данных при передаче и хранении — шифрование и подпись, на чьих сертификатах, кто и где расшифровывает
      - Описаны отказоустойчивость, резервное копирование и восстановление
      - Описаны мониторинг и журналирование событий
      - Указаны ограничения и риски решения

  - name: Программа и методика испытаний
    match: [программа и методика испытаний, программа испытаний, методика испытаний, программа тестирования]
    items:
      - Для каждого требования задания есть проверка
      - У каждой проверки указаны исходные данные, шаги и ожидаемый результат
      - Указаны среда (стенд) испытаний и нужные для неё данные
      - Указаны критерии успешного прохождения испытаний
      - Указано, какие проверки автоматизированы и как их запустить, а для ручных — почему они ручные

  - name: Протокол испытаний
    match: [протокол испытаний, протокол тестирования]
    items:
      - Для каждой проверки указаны фактический результат и вывод — успешно или нет
      - Выполнены все проверки программы испытаний, а для невыполненных указана причина
      - Выявленные несоответствия перечислены со сроками и ответственными за устранение
      - Указаны дата, стенд и участники испытаний

  - name: Протокол, план
    match: [протокол совещания, протокол, план-график, план мероприятий]
    items:
      - Перечислены все обязательства — что сделать, кто отвечает и к какому сроку
      - Сроки согласованы с зависимостями от других работ и смежных систем
      - Понятно, как и кем будет подтверждено выполнение каждого пункта
