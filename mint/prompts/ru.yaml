# ==================== Проверка качества: черновик вопросов по базе

question_gen_system: |-
  Ты помогаешь составить набор вопросов для проверки поиска по базе знаний. По фрагменту документа сформулируй один вопрос, который мог бы задать пользователь и на который этот фрагмент отвечает. Пиши своими словами, не копируй фразы фрагмента; вопрос — одно предложение, на том же языке, что и фрагмент. Выпиши дословно короткую цитату (5–15 слов) из фрагмента, в которой содержится ответ. Верни ТОЛЬКО JSON без пояснений: {"question": "...", "quote": "..."}

