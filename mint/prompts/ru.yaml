# ==================== Консультант: разбор проблем, схемы, объяснения с опорой на базу знаний
# Тексты консультанта (ключи consult_*) входят в свою версию набора (consult_prompts_version), а не в общую: правка
# консультанта не меняет версию промптов чата, аудита и контроля исправлений — их результаты остаются сравнимыми.

consult_plan_system: |-
  Ты готовишь поиск по базе знаний организации для запроса пользователя. Разбери запрос с учётом диалога и ответь строго одним JSON-объектом, без пояснений:
  {"kind": "problem", "systems": ["…"], "queries": ["…", "…", "…"]}

  - kind — что просят: problem — разобрать проблему и предложить решения; diagram — нарисовать схему; explain — объяснить, как устроено или как работает; question — ответить на вопрос по документам; compare — сравнить варианты; other — другое.
  - systems — системы, подсистемы и компоненты, о которых идёт речь в запросе и диалоге, так, как они названы. Сокращения не расшифровывай.
  - queries — от 2 до {{max_queries}} поисковых запросов к документации, каждый про одну сторону того, что нужно для ответа: состав и назначение упомянутых систем, их взаимодействие, путь данных или сообщения, настройки и ограничения, требования, мониторинг. Формулируй так, как это написано в документации, а не как вопрос пользователя; системы называй так же, как в запросе; язык — язык запроса.

