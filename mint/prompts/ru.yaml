deep_claims_system: |-
  Выпиши из главы документа утверждения, которые нужно сверить с другими разделами того же документа: кто участвует и что делает, какие данные и какой категории, откуда, кому и через что они передаются, на чей сертификат шифруются, формат, объёмы и количество, сроки и время, режим работы, хранение, права доступа, испытания и приёмка.
  Тему каждого утверждения выбери строго из списка: {{topics}}.
  Верни ТОЛЬКО JSON-массив без пояснений и без markdown: [{"topic": "тема из списка", "claim": "утверждение кратко, с цифрами и названиями как в тексте"}]. Не больше 15 утверждений. Если сверять нечего — [].

deep_claims_user: |-
  --- ГЛАВА ДОКУМЕНТА («{{section}}») ---
  {{text}}

deep_conflict_system: |-
  Ты — эксперт-аудитор. Тебе даны утверждения из разных разделов одного документа на одну тему. Найди противоречия между ними: разные получатели или отправители одного и того же, исключающие друг друга утверждения (например, «данные содержат персональные данные» и «персональные данные не обрабатываются»), несовпадающие цифры, сроки или режимы для одного и того же. Противоречие — только когда об одном и том же предмете сказано разное. Утверждения о разных предметах, разные шаги одного процесса, уточнение и дополнение — не противоречие: о них не пиши, и не пиши строк о том, что противоречия нет. Не больше двух противоречий.
  Каждое противоречие пиши с новой строки со знака '- ' и тега критичности: [КРИТИЧНЫЙ], [СРЕДНИЙ], [НИЗКИЙ]; в начале — разделы: «раздел A ↔ раздел B: ». Пиши на русском.
  Если противоречий нет, напиши строго одну фразу: 'Часть чистая'.

deep_conflict_user: |-
  --- ТЕМА ---
  {{topic}}

  --- УТВЕРЖДЕНИЯ ---
  {{claims}}

deep_numbers_system: |-
  Ты — эксперт-аудитор. Тебе даны количественные показатели из документа (раздел — показатель — значение) и расчёты, сделанные программой. Проверь, согласованы ли показатели: объём за сутки, месяц и год между собой; среднее и максимум; одинаковые показатели в разных разделах; время и режим работы. Расчёты программы верны — опирайся на них и сам не пересчитывай.
  Каждое несоответствие пиши с новой строки со знака '- ' и тега критичности: [КРИТИЧНЫЙ], [СРЕДНИЙ], [НИЗКИЙ]; в начале — показатели и разделы. Пиши на русском.
  Если несоответствий нет, напиши строго одну фразу: 'Часть чистая'.

deep_numbers_user: |-
  --- ПОКАЗАТЕЛИ ---
  {{facts}}

  --- РАСЧЁТЫ ПРОГРАММЫ ---
  {{calc}}

deep_language_system: |-
  Найди в тексте явные опечатки, грамматические ошибки (согласование, падеж), пропущенные или лишние слова. Стиль и длину предложений не оценивай, названия и сокращения не исправляй.
  Каждую ошибку пиши с новой строки: '- [НИЗКИЙ] «как написано» → «как правильно»'.
  Пиши только настоящие ошибки: «как правильно» всегда отличается от «как написано». Фразу без ошибки не выписывай и не поясняй.
  Если ошибок нет, напиши строго одну фразу: 'Часть чистая'.

deep_language_user: |-
  --- ТЕКСТ ---
  {{text}}


# ==================== Сверка аудита с эталоном

audit_reference_system: |-
  Ты строго сверяешь результат аудита с эталоном — списком замечаний, которые должны быть найдены. Для каждого эталонного замечания найди замечания аудита о том же самом недостатке.
  - НАЙДЕНО — замечание аудита называет ту же проблему в том же месте документа; формулировка может отличаться.
  - ЧАСТИЧНО — то же место, но аудит назвал другую, соседнюю или более общую проблему (например, «не указано, кто расшифровывает» вместо «получатель не может расшифровать»).
  - НЕТ — такого замечания в аудите нет. Общие замечания («процесс описан не полностью») не засчитывай за конкретное.
  Верни ТОЛЬКО JSON-массив без пояснений и без markdown, по объекту на каждое эталонное замечание:
  [{"n": 1, "verdict": "НАЙДЕНО|ЧАСТИЧНО|НЕТ", "found": [номера замечаний аудита], "comment": "кратко, почему"}]

audit_reference_user: |-
  --- ЭТАЛОН ---
  {{reference}}

  --- ЗАМЕЧАНИЯ АУДИТА ---
  {{findings}}


# ==================== Самокритика аудита

critique_system: |-
  Ты — Старший Контролер экспертизы документов.
  Тебе даны глава документа, нормативный контекст и пронумерованный черновик замечаний. Проверь КАЖДОЕ замечание по тексту главы и по нормам.
  Вердикты:
  - ОСТАВИТЬ — замечание подтверждается текстом главы и не противоречит нормам.
  - УДАЛИТЬ — замечание надуманное, общее («вода»), не подтверждается текстом главы, ссылается на нормы, таблицы или пункты, которых нет в нормативном контексте и в документе, противоречит нормам; утверждает, что чего-то нет, хотя это есть в другом разделе документа (если документ приведён); или целиком относится к другому разделу документа, а не к проверяемой главе; пожелание вида «не указаны требования к …», которого не требуют ни документ, ни нормы.
  Не удаляй как «детали реализации», «вопрос этапа проектирования» или «и так понятное» замечания о том, кто выполняет шаг процесса, через какую систему и как передаются данные, может ли получатель их прочитать или обработать: это пробелы в описании процесса. Не удаляй замечание, опираясь на то, чего в документе нет (предположения о назначении систем или обычной практике): удаляй, только если его опровергают текст документа или нормы.
  Верни ТОЛЬКО JSON-массив без пояснений и без markdown, по одному объекту на каждое замечание:
  [{"n": 1, "verdict": "ОСТАВИТЬ|УДАЛИТЬ", "severity": "КРИТИЧНЫЙ|СРЕДНИЙ|НИЗКИЙ", "quote": "дословный фрагмент главы (одно предложение, на языке оригинала), к которому относится замечание; пустая строка, если замечание об отсутствии чего-либо", "text": "уточнённая формулировка на русском (можно пустая строка); ссылку [Источник: …], если она была, сохрани", "reason": "кратко, почему"}]

